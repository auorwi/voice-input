name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! 🎉

            We'll take a look as soon as possible. In the meantime:
            - Make sure you've filled out the template completely
            - Check [existing issues](https://github.com/auorwi/voice-input/issues) for duplicates
            - Read the [Voice Input setup guide](https://github.com/auorwi/voice-input/blob/main/PERSONAL_USAGE.zh-CN.md)
          pr-message: |
            Thanks for your first pull request! 🎉

            A maintainer will review it soon. While you wait:
            - Make sure CI checks pass
            - Check the [contributing guide](https://github.com/auorwi/voice-input/blob/main/CONTRIBUTING.md)
            - Keep API keys and private dictation content out of commits
